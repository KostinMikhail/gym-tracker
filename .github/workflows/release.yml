name: Release

# Каждый push в main: тесты + lint → подписанный release-APK → GitHub Release v1.0.<номер запуска>.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # SHA-256 сертификата release-ключа. Если APK подписан другим ключом — релиз не публикуется
  # (иначе обновление не встанет поверх установленного приложения).
  EXPECTED_CERT_SHA256: 9dd0b101699e3a9b430c4c76b70b10e655ad5f4e3b402ec42dc2a1d90509c375

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests + lint
        run: ./gradlew testDebugUnitTest lint --stacktrace

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.GYM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Secret GYM_KEYSTORE_BASE64 is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gym-release.jks"
          echo "GYM_KEYSTORE_FILE=$RUNNER_TEMP/gym-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          GYM_KEYSTORE_PASSWORD: ${{ secrets.GYM_KEYSTORE_PASSWORD }}
          GYM_KEY_ALIAS: ${{ secrets.GYM_KEY_ALIAS }}
          GYM_KEY_PASSWORD: ${{ secrets.GYM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          grep -q "SHA-256 digest: $EXPECTED_CERT_SHA256" certs.txt || { echo "APK signed with unexpected key"; exit 1; }
          rm -f "$GYM_KEYSTORE_FILE"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          APK="gym-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          git log -1 --pretty=%B > notes.txt
          gh release create "v${VERSION}" "$APK" \
            --title "Gym ${VERSION}" \
            --notes-file notes.txt \
            --target "$GITHUB_SHA"
